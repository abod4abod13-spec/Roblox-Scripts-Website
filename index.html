<html lang="ar" dir="rtl">
<head>

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #060612;
            --card: #12122a;
            --border: #2a2a45;
            --text: #e8e8f0;
            --sub: #a0a0c0;
            --font: 'Cairo', sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 10%, rgba(124,92,252,0.12) 0%, transparent 50%),
                              radial-gradient(ellipse at 80% 90%, rgba(255,107,157,0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050510; z-index: 99999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.4s, visibility 0.4s;
        }
        #loadingScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-spin {
            width: 44px; height: 44px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: #7c5cfc;
            border-right-color: #ff6b9d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-msg { color: #a0a0c0; margin-top: 14px; font-weight: 700; font-size: 0.9em; font-family: var(--font); }
        .loader-bar { width: 170px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .loader-bar-fill { height: 100%; background: linear-gradient(90deg, #7c5cfc, #ff6b9d, #ffd700); border-radius: 10px; width: 0%; transition: width 0.3s; }

        .container { max-width: 920px; margin: 0 auto; padding: 10px 12px; }
        .header { text-align: center; padding: 20px 10px 12px; animation: fadeDown 0.6s ease; }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
        .header .icon { font-size: 2.6em; animation: float 2.8s ease-in-out infinite; display: block; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .header h1 {
            font-size: 2em; font-weight: 900; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #7c5cfc, #ff6b9d, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: grad 3s infinite; line-height: 1.2;
        }
        @keyframes grad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .header .sub { color: var(--sub); font-size: 0.78em; font-weight: 500; margin-top: 1px; }
        .badges { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 7px; }
        .badge { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 12px; font-size: 0.65em; color: #c0c0d8; font-weight: 600; }
        .badge.dev { background: #7c5cfc; color: #fff; border: none; }
        .badge.ver { background: #00b894; color: #fff; border: none; font-weight: 700; }

        .search-bar { display: flex; gap: 6px; margin: 10px 0; animation: fadeDown 0.7s ease; }
        .search-bar input {
            flex: 1; padding: 9px 13px; border-radius: 18px;
            border: 2px solid var(--border); background: var(--card);
            color: #fff; font-size: 0.78em; font-family: var(--font);
            transition: 0.25s;
        }
        .search-bar input:focus { outline: none; border-color: #7c5cfc; box-shadow: 0 0 0 3px rgba(124,92,252,0.1); }
        .search-bar input::placeholder { color: #5a5a7a; font-size: 0.9em; }

        .stats { display: flex; gap: 6px; margin: 10px 0; animation: fadeDown 0.8s ease; }
        .stat {
            flex: 1; text-align: center; background: var(--card);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 9px 5px; transition: 0.2s;
        }
        .stat:hover { transform: translateY(-2px); border-color: rgba(124,92,252,0.3); }
        .stat .num { font-size: 1.4em; font-weight: 900; background: linear-gradient(135deg, #7c5cfc, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat .lbl { font-size: 0.6em; color: #888; font-weight: 500; }

        .tabs-wrap { overflow-x: auto; margin: 7px 0 10px; white-space: nowrap; animation: fadeDown 0.9s ease; }
        .tabs-wrap::-webkit-scrollbar { display: none; }
        .tab {
            display: inline-block; padding: 5px 12px; border-radius: 16px;
            background: var(--card); border: 2px solid var(--border);
            cursor: pointer; font-size: 0.68em; color: #a0a0c0;
            margin-left: 4px; font-family: var(--font); font-weight: 600;
            transition: 0.2s;
        }
        .tab:hover { border-color: rgba(124,92,252,0.4); color: #fff; }
        .tab.active { background: #7c5cfc; color: #fff; border-color: #7c5cfc; }
        .tab.owner.active { background: linear-gradient(135deg, #ff6b9d, #ff8e53); border-color: #ff6b9d; }

        .cat-title { font-size: 0.9em; font-weight: 700; margin: 12px 0 7px; }

        .script-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 13px; padding: 10px 12px; margin: 6px 0;
            transition: 0.2s; opacity: 0; transform: translateY(12px);
            animation: cardUp 0.35s ease forwards;
        }
        @keyframes cardUp { to { opacity: 1; transform: translateY(0); } }
        .script-card:hover { border-color: rgba(124,92,252,0.3); transform: translateY(-2px); }
        .script-card.owner { border-right: 3px solid #ff6b9d; }
        .script-card.mm2 { border-right: 3px solid #e74c3c; }
        .script-card.chat { border-right: 3px solid #00cec9; }
        .script-card.shield { border-right: 3px solid #f39c12; }
        .script-card.msg { border-right: 3px solid #6c5ce7; }
        .script-name {
            font-weight: 700; font-size: 0.8em; margin-bottom: 4px;
            display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
            line-height: 1.3;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff6b9d; flex-shrink: 0; box-shadow: 0 0 5px rgba(255,107,157,0.5); }
        .dot.mm2 { background: #e74c3c; box-shadow: 0 0 7px rgba(231,76,60,0.7); animation: dotPulse 1s infinite; }
        .dot.chat { background: #00cec9; box-shadow: 0 0 7px rgba(0,206,201,0.7); animation: dotPulseChat 1.2s infinite; }
        .dot.shield { background: #f39c12; box-shadow: 0 0 7px rgba(243,156,18,0.7); animation: dotPulseShield 0.9s infinite; }
        .dot.msg { background: #6c5ce7; box-shadow: 0 0 7px rgba(108,92,231,0.7); animation: dotPulseMsg 1.1s infinite; }
        @keyframes dotPulse { 0%,100% { box-shadow: 0 0 5px rgba(231,76,60,0.5); } 50% { box-shadow: 0 0 14px rgba(231,76,60,1); } }
        @keyframes dotPulseChat { 0%,100% { box-shadow: 0 0 5px rgba(0,206,201,0.5); } 50% { box-shadow: 0 0 14px rgba(0,206,201,1); } }
        @keyframes dotPulseShield { 0%,100% { box-shadow: 0 0 5px rgba(243,156,18,0.5); } 50% { box-shadow: 0 0 16px rgba(243,156,18,1); } }
        @keyframes dotPulseMsg { 0%,100% { box-shadow: 0 0 5px rgba(108,92,231,0.5); } 50% { box-shadow: 0 0 14px rgba(108,92,231,1); } }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 0.55em; font-weight: 700; letter-spacing: 0.1px; }
        .tag.owner { background: linear-gradient(135deg, #ff6b9d, #ff8e53); color: #fff; }
        .tag.new { background: #00b894; color: #fff; animation: tagPulse 1.5s infinite; }
        .tag.hot { background: #e74c3c; color: #fff; animation: tagPulse 1s infinite; }
        .tag.pro { background: #6c5ce7; color: #fff; }
        .tag.updated { background: #f39c12; color: #1a1a2e; animation: tagPulse 2s infinite; }
        .tag.exclusive { background: #c0392b; color: #fff; animation: tagPulse 1.3s infinite; }
        .tag.chat { background: #00cec9; color: #1a1a2e; animation: tagPulse 1.4s infinite; }
        .tag.shield { background: #f39c12; color: #1a1a2e; animation: tagPulse 0.9s infinite; }
        .tag.msg { background: #6c5ce7; color: #fff; animation: tagPulse 1.2s infinite; }

        .desc { font-size: 0.68em; color: #b0b0d0; margin-bottom: 4px; line-height: 1.4; }
        .features { font-size: 0.63em; color: #81ecec; margin-bottom: 4px; line-height: 1.5; }
        .features.chat-f { color: #81ecec; }

        .btn-copy:hover { background: #6a4de6; }
        .btn-copy.mm2 { background: #e74c3c; }
        .btn-copy.mm2:hover { background: #c0392b; }
        .btn-copy.chat { background: #00cec9; color: #1a1a2e; }
        .btn-copy.chat:hover { background: #00b894; }
        .btn-copy.shield { background: #f39c12; color: #1a1a2e; }

        .btn-copy.msg { background: #6c5ce7; }

        .btn-fav:hover { border-color: #ffd700; color: #ffd700; }
        .btn-fav.on { background: rgba(255,215,0,0.08); border-color: #ffd700; color: #ffd700; }

        #toast {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px);

        #backTop {
            position: fixed; bottom: 14px; right: 12px; width: 34px; height: 34px;

        @media (max-width: 600px) {

            .stat .num { font-size: 1.1em; }
            .tab { padding: 4px 9px; font-size: 0.62em; }

            .code-box { font-size: 0.55em; }
        }
    </style>

            for (var i = 0; i < cats.length; i++) {
                var hs = 0;
                for (var j = 0; j < S.length; j++) { if (S[j].c === cats[i].k) { hs = 1; break; } }
                if (hs) th += '<span class="tab' + (cats[i].k === cur ? ' active' : '') + (cats[i].k === 'owner' ? ' owner' : '') + '" onclick="sc(\'' + cats[i].k + '\')">' + cats[i].n + '</span>';
            }
            document.getElementById('tabsContainer').innerHTML = th;
            var fl = [];
            for (var k = 0; k < S.length; k++) { if (S[k].c === cur) fl.push(S[k]); }
            var cn = cur;
            for (var x = 0; x < cats.length; x++) { if (cats[x].k === cur) { cn = cats[x].n; break; } }
            var ch = '<div class="cat-title">' + (cur === 'owner' ? '👑 ' : '📂 ') + cn + ' (' + fl.length + ')</div>';
            for (var m = 0; m < fl.length; m++) { ch += card(fl[m], m); }
            if (fl.length === 0) ch += '<p style="text-align:center;padding:20px;color:#888;">لا توجد نتائج</p>';
            document.getElementById('contentArea').innerHTML = ch;
            var fs = document.getElementById('favsSection'), fc = document.getElementById('favsContent');
            if (favs.length > 0) {
                fs.classList.add('show');
                var fh = '';
                for (var p = 0; p < favs.length; p++) {
                    fh += '<div class="script-card" style="animation-delay:' + (p * 0.03) + 's">';
                    fh += '<div class="script-name"><span class="dot"></span>' + esc(favs[p].n) + '</div>';
                    fh += '<div class="code-box">' + esc(favs[p].c) + '</div>';
                    fh += '<div class="actions">';
                    fh += '<button class="btn btn-copy" onclick="cp(this.getAttribute(\'data-code\'))" data-code="' + favs[p].c.replace(/"/g, '&quot;') + '">📋 نسخ</button>';
                    fh += '<button class="btn btn-fav on" onclick="tf(\'' + esc(favs[p].n).replace(/'/g, "\\'") + '\',\'' + favs[p].c.replace(/'/g, "\\'").replace(/"/g, '&quot;') + '\')">⭐</button>';
                    fh += '</div></div>';
                }
                fc.innerHTML = fh;
            } else { fs.classList.remove('show');
                fc.innerHTML = ''; }
            document.getElementById('statScripts').textContent = S.length;
            var cc = 0;
            for (var q = 0; q < cats.length; q++) { for (var rr = 0; rr < S.length; rr++) { if (S[rr].c === cats[q].k) { cc++; break; } } }
            document.getElementById('statCats').textContent = cc;
            document.getElementById('statFavs').textContent = favs.length;
        }

        function sc(c) { cur = c;
            document.getElementById('searchInput').value = '';
            r(); }

        function filterScripts(q) {
            if (!q.trim()) { r(); return; }
            var lq = q.toLowerCase().trim(), rs = [];
            for (var i = 0; i < S.length; i++) { if (S[i].n.toLowerCase().indexOf(lq) >= 0 || S[i].code.toLowerCase().indexOf(lq) >= 0) rs.push(S[i]); }
            var ch = '<div class="cat-title">🔍 نتائج: "' + esc(lq) + '" (' + rs.length + ')</div>';
            if (rs.length > 0) { for (var j = 0; j < rs.length; j++) { ch += card(rs[j], j); } } else ch += '<p style="text-align:center;padding:20px;color:#888;">لا توجد نتائج</p>';
            document.getElementById('contentArea').innerHTML = ch;
            document.getElementById('favsSection').classList.remove('show');
            document.getElementById('favsContent').innerHTML = '';
        }

        window.addEventListener('scroll', function() {
            var bt = document.getElementById('backTop');
            if (window.scrollY > 400) bt.classList.add('visible');
            else bt.classList.remove('visible');
        });

        function startLoading() {
            var d = 1500, st = Date.now(), fill = document.getElementById('loaderFill');
            function upd() { var e = Date.now() - st, p = Math.min((e / d) * 100, 100);
                fill.style.width = p + '%'; if (e < d) requestAnimationFrame(upd); }
            requestAnimationFrame(upd);
            setTimeout(function() { document.getElementById('loadingScreen').classList.add('hide'); }, d);
        }

        r();
        startLoading();
    </script>
</body>
    </html>
