<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsDelta | عبدالله</title>
    <style>
        :root {
            --bg: #0f0f1e;
            --surface: rgba(25, 25, 50, 0.85);
            --surface2: rgba(30, 30, 60, 0.7);
            --text: #f0e6ff;
            --text2: #b8b8d0;
            --primary: #7c5cfc;
            --primary-glow: rgba(124, 92, 252, 0.5);
            --accent: #ff6b9d;
            --accent-glow: rgba(255, 107, 157, 0.4);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --card: rgba(30, 25, 55, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --blur: blur(24px);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(124, 92, 252, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(255, 107, 157, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* جسيمات متحركة */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(720deg);
                opacity: 0;
            }
        }

        /* شاشة التحميل */
        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-container {
            position: relative;
            width: 90px;
            height: 90px;
        }
        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: spinRing 1.5s linear infinite;
        }
        .loader-ring:nth-child(1) {
            border-top-color: #7c5cfc;
            border-right-color: #7c5cfc;
        }
        .loader-ring:nth-child(2) {
            inset: 8px;
            border-bottom-color: #ff6b9d;
            border-left-color: #ff6b9d;
            animation-direction: reverse;
            animation-duration: 1.2s;
        }
        .loader-ring:nth-child(3) {
            inset: 16px;
            border-top-color: #ffd700;
            border-right-color: #ffd700;
            animation-duration: 0.9s;
        }
        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }
        .loader-logo {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            animation: pulseIcon 1.2s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .loader-text {
            margin-top: 24px;
            font-weight: 700;
            font-size: 1.15em;
            background: linear-gradient(135deg, #7c5cfc, #ff6b9d, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 2s infinite;
            letter-spacing: 1px;
        }
        .loader-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
        }
        .loader-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c5cfc, #ff6b9d, #ffd700);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* شريط التقدم */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #7c5cfc, #ff6b9d, #ffd700);
            z-index: 1000;
            transition: width 0.1s linear;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 12px rgba(124, 92, 252, 0.6);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        /* الهيدر */
        .header {
            text-align: center;
            padding: 28px 16px 18px;
            animation: fadeSlideDown 0.7s ease-out;
        }
        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 6px;
        }
        .logo-icon {
            font-size: 3.2em;
            display: block;
            animation: floatIcon 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(124, 92, 252, 0.5));
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
        .logo-text {
            font-size: 2.8em;
            font-weight: 900;
            background: linear-gradient(135deg, #7c5cfc, #ff6b9d, #ffd700, #7c5cfc);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: gradientShift 4s infinite;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 0.95em;
            color: #b8b8d0;
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .badge-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            color: #f0e6ff;
            padding: 7px 15px;
            border-radius: 22px;
            font-size: 0.78em;
            font-weight: 600;
            transition: all var(--transition);
            letter-spacing: 0.3px;
        }
        .badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(124, 92, 252, 0.25);
            border-color: rgba(124, 92, 252, 0.5);
        }
        .badge.dev {
            background: linear-gradient(135deg, #7c5cfc, #6a4de6);
            color: #fff;
            border: none;
            box-shadow: 0 4px 18px rgba(124, 92, 252, 0.4);
        }
        .badge.gold {
            background: linear-gradient(135deg, #ffd700, #ffb800);
            color: #1a1a2e;
            border: none;
            font-weight: 800;
        }

        /* شريط البحث */
        .top-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            animation: fadeSlideDown 0.8s ease-out;
        }
        .search-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            padding-right: 50px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: var(--surface);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            color: #f0e6ff;
            font-size: 0.95em;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .search-wrapper input::placeholder {
            color: #6a6a8a;
        }
        .search-wrapper input:focus {
            outline: none;
            border-color: #7c5cfc;
            box-shadow: 0 0 0 5px rgba(124, 92, 252, 0.12), 0 0 25px rgba(124, 92, 252, 0.15);
            background: rgba(35, 30, 60, 0.9);
        }
        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #7c5cfc;
            pointer-events: none;
            font-size: 1.15em;
            transition: all var(--transition);
        }
        .search-wrapper input:focus~.search-icon {
            color: #ffd700;
            transform: translateY(-50%) scale(1.2);
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: var(--surface);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            cursor: pointer;
            font-size: 1.25em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            color: #f0e6ff;
            flex-shrink: 0;
            position: relative;
        }
        .icon-btn:hover {
            border-color: #7c5cfc;
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.3);
            transform: scale(1.08);
            background: rgba(35, 30, 60, 0.9);
        }
        .icon-btn:active {
            transform: scale(0.92);
            transition: transform 0.1s;
        }
        .lang-btn {
            width: auto;
            padding: 0 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85em;
            gap: 5px;
        }
        .lang-dropdown {
            position: absolute;
            top: 56px;
            right: 0;
            background: rgba(25, 22, 45, 0.95);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 100;
            min-width: 190px;
            max-height: 320px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            padding: 8px;
            animation: scaleIn 0.2s ease;
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .lang-dropdown.show {
            display: flex;
        }
        .lang-dropdown button {
            background: transparent;
            border: none;
            padding: 11px 15px;
            text-align: right;
            cursor: pointer;
            color: #f0e6ff;
            font-size: 0.9em;
            border-radius: 10px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-dropdown button:hover {
            background: rgba(124, 92, 252, 0.2);
        }
        .lang-dropdown button.active {
            background: #7c5cfc;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(124, 92, 252, 0.4);
        }

        /* الإحصائيات */
        .stats-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 18px 0;
            animation: fadeSlideDown 0.9s ease-out;
        }
        .stat-card {
            background: var(--card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            min-width: 90px;
            transition: all var(--transition);
            cursor: default;
            flex: 1;
            max-width: 150px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7c5cfc, #ff6b9d);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .stat-card:hover::before {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 40px rgba(124, 92, 252, 0.2);
            border-color: rgba(124, 92, 252, 0.4);
        }
        .stat-num {
            font-size: 2.1em;
            font-weight: 900;
            background: linear-gradient(135deg, #7c5cfc, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .stat-lbl {
            font-size: 0.73em;
            color: #b8b8d0;
            font-weight: 500;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* التصنيفات */
        .tabs-scroll {
            overflow-x: auto;
            padding: 6px 0;
            margin: 10px 0 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            animation: fadeSlideDown 1s ease-out;
        }
        .tabs-scroll::-webkit-scrollbar {
            display: none;
        }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            padding: 0 4px;
        }
        .tab-btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82em;
            transition: all var(--transition);
            color: #b8b8d0;
            white-space: nowrap;
            font-family: inherit;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            letter-spacing: 0.3px;
        }
        .tab-btn:hover {
            border-color: rgba(124, 92, 252, 0.5);
            color: #f0e6ff;
            transform: translateY(-2px);
            background: rgba(124, 92, 252, 0.1);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c5cfc, #6a4de6);
            color: #fff;
            border-color: #7c5cfc;
            box-shadow: 0 6px 22px rgba(124, 92, 252, 0.45);
            transform: scale(1.05);
        }

        /* المحتوى */
        .content-area {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .section-title {
            font-size: 1.15em;
            font-weight: 800;
            margin: 22px 0 12px;
            color: #f0e6ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .icon {
            font-size: 1.3em;
            animation: floatIcon 2.5s ease-in-out infinite;
        }
        .script-count {
            font-size: 0.7em;
            color: #ffd700;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.1);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.25);
        }

        /* كرت السكربت */
        .script-card {
            background: var(--card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
            transition: all var(--transition);
            opacity: 0;
            transform: translateY(35px);
            animation: cardSlideIn 0.5s ease forwards;
            position: relative;
            overflow: hidden;
        }
        .script-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(124, 92, 252, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }
        .script-card:hover::after {
            opacity: 1;
        }
        @keyframes cardSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .script-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(124, 92, 252, 0.18);
            border-color: rgba(124, 92, 252, 0.35);
        }
        .script-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .script-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b9d;
            flex-shrink: 0;
            animation: dotGlow 2s infinite;
            box-shadow: 0 0 12px rgba(255, 107, 157, 0.7);
        }
        @keyframes dotGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 107, 157, 0.6);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 107, 157, 1), 0 0 35px rgba(255, 107, 157, 0.5);
            }
        }
        .script-name {
            font-weight: 700;
            font-size: 1em;
            color: #f0e6ff;
            flex: 1;
            letter-spacing: 0.2px;
        }
        .key-tag {
            background: linear-gradient(135deg, #ffd700, #ffb800);
            color: #1a1a2e;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.68em;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .code-block {
            background: rgba(15, 12, 30, 0.7);
            border-radius: 12px;
            padding: 12px 14px;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 0.77em;
            word-break: break-all;
            color: #c8c8e0;
            max-height: 55px;
            overflow: hidden;
            position: relative;
            line-height: 1.6;
            margin-bottom: 12px;
            direction: ltr;
            text-align: left;
            user-select: all;
            cursor: text;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .code-block::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 22px;
            pointer-events: none;
            background: linear-gradient(transparent, rgba(15, 12, 30, 0.9));
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8em;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn:active {
            transform: scale(0.93);
            transition: transform 0.1s;
        }
        .btn-copy {
            background: linear-gradient(135deg, #7c5cfc, #6a4de6);
            color: #fff;
            box-shadow: 0 4px 18px rgba(124, 92, 252, 0.35);
        }
        .btn-copy:hover {
            box-shadow: 0 8px 28px rgba(124, 92, 252, 0.5);
            transform: translateY(-2px);
        }
        .btn-copy.copied {
            background: linear-gradient(135deg, #00b894, #00a381);
            animation: copyPop 0.45s ease;
        }
        @keyframes copyPop {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.13);
            }
        }
        .btn-fav {
            background: rgba(255, 255, 255, 0.04);
            color: #b8b8d0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-fav:hover {
            background: rgba(255, 215, 0, 0.12);
            border-color: rgba(255, 215, 0, 0.5);
            color: #ffd700;
        }
        .btn-fav.favorited {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #ffd700;
            animation: heartBeat 0.5s ease;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.25);
        }
        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.22);
            }
            60% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        /* المفضلة */
        .favs-section {
            margin-top: 28px;
            border-top: 2px dashed rgba(255, 255, 255, 0.08);
            padding-top: 22px;
            display: none;
            animation: fadeIn 0.7s ease;
        }
        .favs-section.has-favs {
            display: block;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            background: linear-gradient(135deg, #1e1e3a, #2a2a50);
            color: #fff;
            padding: 14px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9em;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(124, 92, 252, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(40px);
            white-space: nowrap;
            text-align: center;
            border: 1px solid rgba(124, 92, 252, 0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
