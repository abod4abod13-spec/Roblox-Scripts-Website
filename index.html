                for (var j = 0; j < scriptsData.length; j++) { if (scriptsData[j].cat === c.key) { hasScripts = true; break; } }
                if (hasScripts) {
                    tabsHTML += '<button class="tab' + (c.key === currentCat ? ' active' : '') + (c.key === 'owner' ?
                        ' owner-tab' : '') + '" onclick="switchCat(\'' + c.key + '\')">' + c.name + '</button>';
                }
            }
            document.getElementById('tabsContainer').innerHTML = tabsHTML;

            var filtered = [];
            for (var k = 0; k < scriptsData.length; k++) { if (scriptsData[k].cat === currentCat) filtered.push(
                scriptsData[k]); }
            var catInfo = null;
            for (var m = 0; m < cats.length; m++) { if (cats[m].key === currentCat) { catInfo = cats[m]; break; } }
            var contentHTML = '<div class="cat-title">' + (catInfo ? catInfo.icon : '📂') + ' ' + (catInfo ? catInfo.name :
                currentCat) + ' <span class="count-badge' + (currentCat === 'owner' ? ' owner' : '') + '">' + filtered
                .length + '</span></div>';
            for (var n = 0; n < filtered.length; n++) { contentHTML += buildCard(filtered[n], n); }
            if (filtered.length === 0) contentHTML +=
                '<p style="text-align:center;padding:35px;color:#b0b0cc;font-size:1em;">لا توجد نتائج 😕</p>';
            document.getElementById('contentArea').innerHTML = contentHTML;

            var favSection = document.getElementById('favsSection');
            var favContent = document.getElementById('favsContent');
            if (favorites.length > 0) {
                favSection.classList.add('show');
                var favHTML = '';
                for (var p = 0; p < favorites.length; p++) {
                    favHTML += '<div class="script-card" style="animation-delay:' + (p * 0.035) + 's">';
                    favHTML += '<div class="name"><span class="dot"></span>' + esc(favorites[p].name) + '</div>';
                    favHTML += '<div class="code-box">' + esc(favorites[p].code) + '</div>';
                    favHTML += '<div class="actions">';
                    favHTML +=
                        '<button class="btn btn-copy" onclick="var c=this.getAttribute(\'data-code\');copyText(c);this.classList.add(\'done\');setTimeout(function(t){t.classList.remove(\'done\')},1600,this)" data-code="' +
                        favorites[p].code.replace(/"/g, '&quot;').replace(/'/g, '&#39;') + '">📋 نسخ</button>';
                    favHTML +=
                        '<button class="btn btn-fav on" onclick="toggleFav(this.getAttribute(\'data-name\'),this.getAttribute(\'data-code\'))" data-name="' +
                        esc(favorites[p].name).replace(/"/g, '&quot;') + '" data-code="' + favorites[p].code.replace(/"/g,
                            '&quot;').replace(/'/g, '&#39;') + '">⭐ إزالة</button>';
                    favHTML += '</div></div>';
                }
                favContent.innerHTML = favHTML;
            } else {
                favSection.classList.remove('show');
                favContent.innerHTML = '';
            }

            document.getElementById('statScripts').textContent = scriptsData.length;
            var catCount = 0;
            for (var q = 0; q < cats.length; q++) {
                for (var r = 0; r < scriptsData.length; r++) { if (scriptsData[r].cat === cats[q].key) { catCount++; break; } }
            }
            document.getElementById('statCats').textContent = catCount;
            document.getElementById('statFavs').textContent = favorites.length;
        }

        function switchCat(cat) {
            currentCat = cat;
            document.getElementById('searchInput').value = '';
            renderAll();
            window.scrollTo({ top: 280, behavior: 'smooth' });
        }

        function filterScripts(q) {
            if (!q.trim()) { renderAll(); return; }
            var lq = q.toLowerCase().trim();
            var results = [];
            for (var i = 0; i < scriptsData.length; i++) {
                var s = scriptsData[i];
                if (s.name.toLowerCase().indexOf(lq) >= 0 || s.code.toLowerCase().indexOf(lq) >= 0) results.push(s);
            }
            var contentHTML = '<div class="cat-title">🔍 نتائج البحث: "' + esc(lq) + '" <span class="count-badge">' + results
                .length + '</span></div>';
            if (results.length > 0) { for (var j = 0; j < results.length; j++) { contentHTML += buildCard(results[j], j); } } else
                contentHTML += '<p style="text-align:center;padding:35px;color:#b0b0cc;">لا توجد نتائج 😕</p>';
            document.getElementById('contentArea').innerHTML = contentHTML;
            document.getElementById('favsSection').classList.remove('show');
            document.getElementById('favsContent').innerHTML = '';
        }

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('sdlang', lang);
            document.getElementById('langFlag').textContent = lang === 'ar' ? 'AR' : 'EN';
            var btns = document.querySelectorAll('#langDrop button');
            for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); if (btns[i].getAttribute(
                    'onclick').indexOf("'" + lang + "'") >= 0) btns[i].classList.add('active'); }
            document.getElementById('langDrop').classList.remove('show');
        }

        document.getElementById('searchInput').addEventListener('input', function() { filterScripts(this.value); });
        document.getElementById('themeBtn').addEventListener('click', function() { showToast(
                '✨ ScriptsDelta v4 | عبدالله | Premium 💎'); });
        document.getElementById('langBtn').addEventListener('click', function(e) { e.stopPropagation();
            document.getElementById('langDrop').classList.toggle('show'); });
        document.addEventListener('click', function() { document.getElementById('langDrop').classList.remove('show'); });
        window.addEventListener('scroll', function() {
            var st = window.scrollY;
            var dh = document.documentElement.scrollHeight - window.innerHeight;
            document.getElementById('progressBar').style.width = dh > 0 ? (st / dh * 100) + '%' : '0%';
            var bt = document.getElementById('backTop');
            if (st > 400) bt.classList.add('visible');
            else bt.classList.remove('visible');
        });
        document.getElementById('backTop').addEventListener('click', function() { window.scrollTo({ top: 0,
                behavior: 'smooth' }); });

        function startLoading() {
            var duration = 1500;
            var fill = document.getElementById('loaderFill');
            var startTime = Date.now();

            function update() {
                var elapsed = Date.now() - startTime;
                var pct = Math.min((elapsed / duration) * 100, 100);
                fill.style.width = pct + '%';
                if (elapsed < duration) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
            setTimeout(function() { document.getElementById('loadingScreen').classList.add('hide'); }, duration);
        }

        renderAll();
        startLoading();
    </script>
</body>
