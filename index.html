            var catKeys = ['cat_all', 'cat_brookhaven', 'cat_mm2', 'cat_megamansion', 'cat_lava', 'cat_arab', 'cat_wallhop',

            var translations = {

                    searchPlaceholder: '🔍 Search...',
                    statLbl1: 'Scripts',
                    statLbl2: 'Categories',
                    statLbl3: 'Favorites',
                    favsTitle: 'Favorites',
                    noResults: 'No results',
                    copied: '✅ Copied!',
                    cat_all: '🌍 All Maps',
                    cat_brookhaven: '🏡 Brookhaven',
                    cat_mm2: '🔪 MM2',
                    cat_megamansion: '🏠 MegaMansion',
                    cat_lava: '🌋 Lava Floor',

            var langNames = { ar: 'العربية 🇸🇦', en: 'English 🇺🇸' };
            var langFlags = { ar: 'AR', en: 'EN' };

            var currentCat = 'cat_all';
            var favorites = JSON.parse(localStorage.getItem('sdfavs') || '[]');
            var currentLang = localStorage.getItem('sdlang') || 'ar';

            function $(s) { return document.querySelector(s); }

            function $$(s) { return document.querySelectorAll(s); }
            var loadingScreen = $('#loadingScreen');
            var loaderFill = $('#loaderFill');
            var progressBar = $('#progressBar');
            var toast = $('#toast');
            var backTop = $('#backTop');
            var tabsContainer = $('#tabsContainer');
            var contentArea = $('#contentArea');
            var searchInput = $('#searchInput');
            var langBtn = $('#langBtn');
            var langDrop = $('#langDrop');
            var langFlag = $('#langFlag');
            var statScripts = $('#statScripts');
            var statCats = $('#statCats');
            var statFavs = $('#statFavs');
            var favsSection = $('#favsSection');
            var favsContent = $('#favsContent');

            function t(key) { return (translations[currentLang] && translations[currentLang][key]) || key; }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
            }

            function copyText(text) {
                if (!text || text.length === 0) {
                    showToast('❌ لا يوجد نص للنسخ');
                    return;
                }
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function() {
                            showToast(t('copied'));
                        }).catch(function(err) {
                            fallbackCopy(text);
                        });
                    } else {
                        fallbackCopy(text);
                    }
                } catch (e) {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    ta.style.top = '-9999px';
                    ta.style.opacity = '0';
                    ta.style.zIndex = '-1';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    ta.setSelectionRange(0, text.length);
                    var success = document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (success) {
                        showToast(t('copied'));
                    } else {
                        showToast('❌ فشل النسخ');
                    }
                } catch (e) {
                    showToast('❌ المتصفح لا يدعم النسخ');
                }
            }

            function toggleFav(name, code) {
                var idx = -1;
                for (var i = 0; i < favorites.length; i++) { if (favorites[i].code === code) { idx = i; break; } }
                if (idx >= 0) favorites.splice(idx, 1);
                else favorites.push({ name: name, code: code });
                localStorage.setItem('sdfavs', JSON.stringify(favorites));
                updateStats();
                renderAll();
            }

            function isFav(code) {
                for (var i = 0; i < favorites.length; i++) { if (favorites[i].code === code) return true; }
                return false;
            }

            function esc(s) { var d = document.createElement('div');
                d.textContent = s; return d.innerHTML; }

            function escAttr(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g,
                    '&gt;').replace(/'/g, '&#39;'); }

            function buildCardHTML(s, i) {
                var fav = isFav(s.code);
                var en = esc(s.name);
                var ec = escAttr(s.code);
                var html = '<div class="script-card" style="animation-delay:' + (i * 0.03) + 's">';
                html += '<div class="name"><span class="dot"></span>' + en;
                if (s.isKey) html += ' <span class="key-tag">KEY</span>';
                html += '</div>';
                if (!s.isKey) {
                    html += '<div class="code-box">' + esc(s.code) + '</div>';
                    html += '<div class="actions">';
                    html += '<button class="btn btn-copy" data-code="' + ec + '" onclick="window._copyScript(this)">📋 ' +
                        (currentLang === 'ar' ? 'نسخ' : 'Copy') + '</button>';
                    html += '<button class="btn btn-fav' + (fav ? ' on' : '') + '" data-name="' + ec +
                        '" data-code="' + ec + '" onclick="window._toggleFav(this)">' + (fav ? '⭐' : '☆') + ' ' + (
                            currentLang === 'ar' ? 'حفظ' : 'Save') + '</button>';
                    html += '</div>';
                } else {
                    html +=
                        '<div class="actions"><button class="btn btn-copy" data-code="1234" onclick="window._copyScript(this)">📋 ' +
                        (currentLang === 'ar' ? 'نسخ المفتاح' : 'Copy Key') + '</button></div>';
                }
                html += '</div>';
                return html;
            }

            function renderAll() {
                var cats = [];
                for (var i = 0; i < catKeys.length; i++) {
                    for (var j = 0; j < scriptsData.length; j++) {
                        if (scriptsData[j].cat === catKeys[i]) { cats.push(catKeys[i]); break; }
                    }
                }
                var tabsHtml = '';
                for (var k = 0; k < cats.length; k++) {
                    tabsHtml += '<button class="tab' + (cats[k] === currentCat ? ' active' : '') + '" data-cat="' + cats[
                        k] + '">' + t(cats[k]) + '</button>';
                }
                tabsContainer.innerHTML = tabsHtml;

                var filtered = [];
                for (var m = 0; m < scriptsData.length; m++) {
                    if (scriptsData[m].cat === currentCat) filtered.push(scriptsData[m]);
                }
                var contentHtml = '<div class="cat-title">📂 ' + t(currentCat) + ' <span class="count-badge">' + filtered
                    .length + '</span></div>';
                for (var n = 0; n < filtered.length; n++) { contentHtml += buildCardHTML(filtered[n], n); }
                if (filtered.length === 0) contentHtml += '<p style="text-align:center;padding:30px;color:#a0a0c0;">' + t(
                    'noResults') + '</p>';
                contentArea.innerHTML = contentHtml;

                if (favorites.length > 0) {
                    favsSection.classList.add('show');
                    var favHtml = '';
                    for (var p = 0; p < favorites.length; p++) {
                        var fcode = favorites[p].code;
                        var fname = favorites[p].name;
                        var ec2 = escAttr(fcode);
                        favHtml += '<div class="script-card" style="animation-delay:' + (p * 0.03) + 's">';
                        favHtml += '<div class="name"><span class="dot"></span>' + esc(fname) + '</div>';
                        favHtml += '<div class="code-box">' + esc(fcode) + '</div>';
                        favHtml += '<div class="actions">';
                        favHtml += '<button class="btn btn-copy" data-code="' + ec2 +
                            '" onclick="window._copyScript(this)">📋 ' + (currentLang === 'ar' ? 'نسخ' : 'Copy') +
                            '</button>';
                        favHtml += '<button class="btn btn-fav on" data-name="' + ec2 + '" data-code="' + ec2 +
                            '" onclick="window._toggleFav(this)">⭐ ' + (currentLang === 'ar' ? 'إزالة' : 'Remove') +
                            '</button>';
                        favHtml += '</div></div>';
                    }
                    favsContent.innerHTML = favHtml;
                } else { favsSection.classList.remove('show');
                    favsContent.innerHTML = ''; }
            }

            function updateStats() {
                statScripts.textContent = scriptsData.length;
                var cats = [];
                for (var i = 0; i < catKeys.length; i++) {
                    for (var j = 0; j < scriptsData.length; j++) {
                        if (scriptsData[j].cat === catKeys[i]) { cats.push(catKeys[i]); break; }
                    }
                }
                statCats.textContent = cats.length;
                statFavs.textContent = favorites.length;
            }

            function filterScripts(q) {
                if (!q.trim()) { renderAll(); return; }
                var lq = q.toLowerCase().trim();
                var results = [];
                for (var i = 0; i < scriptsData.length; i++) {
                    var s = scriptsData[i];
                    if (s.name.toLowerCase().indexOf(lq) >= 0 || s.code.toLowerCase().indexOf(lq) >= 0 || (t(s.cat) || '')
                        .toLowerCase().indexOf(lq) >= 0) {
                        results.push(s);
                    }
                }
                var html = '<div class="cat-title">🔍 نتائج: "' + esc(lq) + '" <span class="count-badge">' + results
                    .length + '</span></div>';
                if (results.length > 0) { for (var j = 0; j < results.length; j++) { html += buildCardHTML(results[j], j); } } else { html +=
                        '<p style="text-align:center;padding:30px;color:#a0a0c0;">' + t('noResults') + '</p>'; }
                contentArea.innerHTML = html;
                favsSection.classList.remove('show');
                favsContent.innerHTML = '';
            }

            function updateAllTexts() {
                document.title = t('siteTitle');
                $('#siteTitle').textContent = t('siteTitle');
                $('#siteSub').textContent = t('siteSub');
                searchInput.placeholder = t('searchPlaceholder');
                $('#statLbl1').textContent = t('statLbl1');
                $('#statLbl2').textContent = t('statLbl2');
                $('#statLbl3').textContent = t('statLbl3');
                $('#favsTitle').textContent = t('favsTitle');
                langFlag.textContent = langFlags[currentLang] || 'AR';
                renderLangDrop();
                renderAll();
            }

            function renderLangDrop() {
                var html = '';
                var keys = Object.keys(langNames);
                for (var i = 0; i < keys.length; i++) {
                    html += '<button data-lang="' + keys[i] + '" class="' + (keys[i] === currentLang ? 'active' : '') +
                        '">' + langNames[keys[i]] + '</button>';
                }
                langDrop.innerHTML = html;
            }

            window._copyScript = function(btn) {
                var code = btn.getAttribute('data-code');
                if (code) {
                    copyText(code);
                    btn.classList.add('done');
                    setTimeout(function() { btn.classList.remove('done'); }, 1500);
                }
            };
            window._toggleFav = function(btn) {
                var name = btn.getAttribute('data-name');
                var code = btn.getAttribute('data-code');
                if (name && code) toggleFav(name, code);
            };

            tabsContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('tab')) {
                    currentCat = e.target.getAttribute('data-cat');
                    searchInput.value = '';
                    renderAll();
                    window.scrollTo({ top: 250, behavior: 'smooth' });
                }
            });
            searchInput.addEventListener('input', function() { filterScripts(this.value); });
            $('#themeBtn').addEventListener('click', function() { showToast('✨ ' + t('siteTitle') + ' | عبدالله'); });
            langBtn.addEventListener('click', function(e) { e.stopPropagation();
                langDrop.classList.toggle('show'); });
            langDrop.addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON') {
                    var l = e.target.getAttribute('data-lang');
                    if (l && l !== currentLang) { currentLang = l;
                        localStorage.setItem('sdlang', l);
                        updateAllTexts(); }
                    langDrop.classList.remove('show');
                }
            });
            document.addEventListener('click', function() { langDrop.classList.remove('show'); });
            window.addEventListener('scroll', function() {
                var st = window.scrollY;
                var dh = document.documentElement.scrollHeight - window.innerHeight;
                progressBar.style.width = dh > 0 ? (st / dh * 100) + '%' : '0%';
                if (st > 400) backTop.classList.add('visible');
                else backTop.classList.remove('visible');
            });
            backTop.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

            function startLoading() {
                var duration = 1500;
                var start = Date.now();

                function update() {
                    var elapsed = Date.now() - start;
                    var pct = Math.min((elapsed / duration) * 100, 100);
                    loaderFill.style.width = pct + '%';
                    if (elapsed < duration) requestAnimationFrame(update);
                }
                requestAnimationFrame(update);
                setTimeout(function() { loadingScreen.classList.add('hide'); }, duration);
            }

            function init() {
                updateStats();
                updateAllTexts();
                renderLangDrop();
                langFlag.textContent = langFlags[currentLang] || 'AR';
                startLoading();
            }
            init();
        })();
